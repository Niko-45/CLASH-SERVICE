<html lang="tg"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Қалъаёвар</title>

<style>
:root{--bg:#10132A;--card:#1B1F3B;--card2:#262B55;--gold:#F5B83D;--mut:#9AA0C0;--tx:#F4F1E8;--ok:#4CC38A;--bad:#FF8A8A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 14px calc(40px + env(safe-area-inset-bottom));background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:0 auto}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:21px;margin:6px 0 14px}
.mut{color:var(--mut);font-size:13px}.gold{color:var(--gold);font-weight:600}
.lang{display:flex;justify-content:flex-end;gap:6px;padding-top:10px}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:10px 0;background:var(--bg)}
.nav span{position:relative;flex:1;text-align:center;padding:9px 2px;border-radius:12px;background:var(--card);color:var(--mut);font-size:13px;cursor:pointer}
.nav span.on{background:var(--gold);color:#14172B;font-weight:600}
.nav i{position:absolute;top:-5px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#2a0d0d;font:600 11px/18px system-ui;font-style:normal}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;border-left:4px solid transparent;animation:in .25s ease}
.card:active{transform:scale(.985)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.tag{font-size:12px;padding:3px 10px;border-radius:8px;background:#10132A;white-space:nowrap}
.ic{width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin:10px 0 3px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sv{background:var(--card);border-radius:16px;padding:16px 12px;cursor:pointer;animation:in .25s ease}
.sv:active{transform:scale(.97)}
.sv.x{background:none;border:1.5px dashed var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:2px 0 12px;padding-bottom:2px}
.chip{flex:none;padding:7px 13px;border-radius:20px;background:var(--card);color:var(--mut);font-size:13px;cursor:pointer}
.chip.on{color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input,textarea{width:100%;padding:12px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:80px}
input[type=file]{padding:10px}
input[type=checkbox]{padding:0}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--gold);color:#14172B;font:600 15px inherit;cursor:pointer}
.btn:active{opacity:.85}.btn.g{background:var(--card2);color:var(--tx)}.btn.ok{background:var(--ok);color:#0E2A1D}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut)}
.chk input{width:20px;height:20px;flex:none;margin:0}
input.sw{-webkit-appearance:none;appearance:none;width:44px;height:26px;padding:0;border-radius:13px;background:#3A3F6B;position:relative;cursor:pointer;flex:none}
input.sw:checked{background:var(--ok)}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
input.sw:checked::after{left:21px}
.back{display:inline-block;color:var(--mut);cursor:pointer;margin:6px 0}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:45vh;margin-bottom:12px}
.m{max-width:80%;padding:9px 12px;border-radius:16px 16px 16px 4px;background:var(--card);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--gold);color:#14172B}
.send{display:flex;gap:8px;position:sticky;bottom:8px}
.sb{width:48px;border:0;border-radius:12px;background:var(--gold);font-size:18px;cursor:pointer}
.pic{width:100%;border-radius:14px;margin:6px 0;display:block}
</style></head>

const shrink=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.75))};i.onerror=rej;i.src=URL.createObjectURL(f)});
const thumb=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas"),S=128;c.width=c.height=S;const x=c.getContext("2d");x.fillStyle="#262B55";x.fillRect(0,0,S,S);const m=Math.min(i.width,i.height);x.drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,S,S);res(c.toDataURL("image/jpeg",.8))};i.onerror=rej;i.src=URL.createObjectURL(f)});
function showPic(box,src){const im=new Image();im.src=src;im.className="pic";im.onclick=()=>zoom(src);box.appendChild(im)}
function zoom(src){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#000;z-index:9;display:flex;align-items:center;justify-content:center";
 const im=new Image();im.src=src;im.style.cssText="max-width:100%;max-height:100%";d.appendChild(im);d.onclick=()=>d.remove();document.body.appendChild(d)}

/* ---------- ҳисобкунак ---------- */
function estimate(s,vals){
 if(!s.unit_price)return null;let fr=null,to=null,ct=null;
 s.fields.forEach((f,i)=>{const n=parseFloat(vals[i]),v=isNaN(n)?null:n;if(f.role=="from")fr=v;else if(f.role=="to")to=v;else if(f.role=="count")ct=v});
 if(fr!==null&&to!==null)return Math.max(0,to-fr)*s.unit_price;
 if(ct!==null)return Math.max(0,ct)*s.unit_price;
 return null;
}
function calcEst(k){const s=SVC[k],e=estimate(s,s.fields.map((f,i)=>g("f_"+i).value));g("est").textContent=e===null?"":t("est")+": "+e+" "+t("som")}

function card(o){
 const s=sv(o.service);
 return `<div class="card" style="border-left-color:${COL[o.status]||COL.new}" onclick="detail(${+o.id})"><div class="row"><div style="display:flex;gap:10px;align-items:center">${ic(s)}<div><b>${esc(loc(s.name))}</b><div class="mut">#${+o.id} · ${ago(o.created_at)}${me.admin?" · @"+esc(o.users?.username||o.users?.name||o.user_id):""}</div></div></div>${tag(o.status)}</div>${o.price?`<div class="gold" style="margin-top:8px">${+o.price} ${t("som")}</div>`:""}${prog(o)}</div>`}

 A.innerHTML=`<p class="mut" style="padding:20px 0">${t("load")}</p>`;

 catch(e){A.innerHTML=`<p style="padding:20px 0">${t("errOpen")}</p>`;return}

function listView(){
 const c=k=>orders.filter(o=>grp(o)==k).length;
 const chips=[["all",t("f_all"),orders.length],["new",t("f_new"),c("new")],["run",t("f_run"),c("run")],["done",t("f_done"),c("done")]];
 let body;
 if(flt=="all"){
  const act=orders.filter(o=>grp(o)=="new"||grp(o)=="run"),rest=orders.filter(o=>grp(o)=="done"||grp(o)=="rej");
  body=act.map(card).join("")||`<p class="mut">${t("noact")}</p>`;
  if(rest.length)body+=`<div class="chip" style="display:inline-block;margin-bottom:10px" onclick="more=!more;listView()">${more?t("hide")+" ▴":t("others")+" ("+rest.length+") ▾"}</div>`+(more?rest.map(card).join(""):"");
 }else body=orders.filter(o=>grp(o)==flt).map(card).join("")||`<p class="mut">${t("empty")}</p>`;
 A.innerHTML=nav("o")+`<h2>${me.admin?t("admin"):t("hello")+" "+esc(me.name)}</h2>`+
  `<div class="chips">${chips.map(([k,l,n])=>`<span class="chip${flt==k?" on":""}" onclick="hap();flt='${k}';listView()">${l} ${n}</span>`).join("")}</div>`+body+
  (me.admin?"":`<button class="btn" onclick="pick()">${t("newreq")}</button>`);
}
function pick(){
 const it=Object.values(SVC).filter(x=>x.active);
 A.innerHTML=`<span class="back" onclick="home()">${t("back")}</span><h2>${t("pick")}</h2><div class="grid">`+
  it.map(s=>`<div class="sv${s.key=="custom"?" x":""}" onclick="form('${esc(s.key)}')">${ic(s,46)}<b style="display:block;margin-top:8px">${esc(loc(s.name))}</b><div class="mut">${s.price?t("from")+" "+(+s.price)+" "+t("som"):t("nego")}</div></div>`).join("")+"</div>";

function form(k){

  s.fields.map((f,i)=>`<label>${esc(loc(f.label))}${f.opt?" "+t("opt"):""}</label><input id="f_${i}" type="${f.type=="number"?"number":"text"}" inputmode="${f.type=="number"?"numeric":"text"}" oninput="calcEst('${esc(k)}')">`).join("")+
  `<div class="gold" id="est" style="margin-top:12px"></div><label>${t("note")}</label><textarea id="note"></textarea><label>${t("shot")}</label><input id="img" type="file" accept="image/*">`+

async function send(k){
 const s=SVC[k],data={};
 for(let i=0;i<s.fields.length;i++){const f=s.fields[i],v=g("f_"+i).value.trim();if(!v&&!f.opt){g("err").textContent=t("fill")+loc(f.label);return}if(v)data[f.label]=v}
 if(s.acc&&!g("ok").checked){g("err").textContent=t("consentNeed");return}
 g("go").disabled=true;g("err").textContent=t("sending");
 try{const f=g("img").files[0];
  await api("/api/orders/create",{service:k,data,note:g("note").value.trim(),image:f?await shrink(f):null});
  try{tg.HapticFeedback.notificationOccurred("success")}catch(e){}
  home()}
 catch(e){g("err").textContent=t("errRetry");g("go").disabled=false}
}

function detail(id){
 const o=orders.find(x=>x.id==id),s=sv(o.service),st=o.status,ad=me.admin;
 const rows=Object.entries(o.data||{}).map(([k,v])=>`<div class="row"><span class="mut">${esc(loc(LEG[k]||k))}</span><b>${esc(v)}</b></div>`).join("");
 const priceCard=`<div ${cd}><div class="gold" style="font-size:24px">${+o.price} ${t("som")}</div>${+o.hours?`<div class="mut">${t("term")}: ${t("about")} ${+o.hours} ${t("hrs")}</div>`:""}</div>`;
 let act="";
 if(ad){
  if(st=="new"||st=="priced")act=`<label>${t("priceLbl")}${o.est_price?" · "+t("estHint")+" "+(+o.est_price):""}</label><input id="pr" type="number" min="0" value="${+o.price||+o.est_price||""}"><label>${t("hoursLbl")}</label><input id="hr" type="number" min="0" step="0.5" value="${+o.hours||""}"><button class="btn" onclick="setPrice(${+o.id})">${t("priceBtn")}</button>`;
  else if(st=="checking")act=`<p class="mut">${t("receiptTitle")}</p><div id="rc"></div><div class="grid"><button class="btn ok" onclick="run('/api/orders/paycheck',{id:${+o.id},ok:true})">${t("payOk")}</button><button class="btn g" onclick="run('/api/orders/paycheck',{id:${+o.id},ok:false})">${t("payBad")}</button></div>`;
  else if(st=="working")act=`<label>${t("resultLbl")}</label><input id="rs" type="file" accept="image/*"><button class="btn ok" onclick="finish(${+o.id})">${t("finish")}</button>`;
  else if(st=="done")act=`<p class="mut">${t("resultTitle")}</p><div id="rc"></div><label>${t("addResult")}</label><input id="rs" type="file" accept="image/*"><button class="btn g" onclick="addRes(${+o.id})">${t("send")}</button>`;
  if(!["done","cancelled","rejected"].includes(st))act+=`<label>${t("reasonPh")}</label><input id="cr"><button class="btn g" onclick="cancel(${+o.id})">${t("cancel")}</button>`;
 }else{
  if(st=="priced")act=priceCard+`<div class="grid"><button class="btn ok" onclick="run('/api/orders/confirm',{id:${+o.id},accept:true})">${t("accept")}</button><button class="btn g" onclick="run('/api/orders/confirm',{id:${+o.id},accept:false})">${t("decline")}</button></div>`;
  else if(st=="unpaid")act=priceCard+`<h2 style="font-size:17px;margin-top:16px">${t("payTitle")}</h2><div ${cd} id="pi" style="white-space:pre-wrap">…</div><label>${t("receiptLbl")}</label><input id="rs" type="file" accept="image/*"><p class="err" id="err"></p><button class="btn" onclick="payRc(${+o.id})">${t("sendReceipt")}</button>`;
  else if(st=="checking")act=`<div ${cd}>${t("checkingMsg")}</div>`;
  else if(st=="done"){act=`<p class="mut">${t("resultTitle")}</p><div id="rc"></div>`;
   if(!o.reviewed)act+=`<label>${t("rate")}</label><div id="stars" style="font-size:34px;color:var(--gold)">${[1,2,3,4,5].map(i=>`<span onclick="star(${i})">☆</span>`).join("")}</div><textarea id="rt" placeholder="${t("reviewPh")}"></textarea><button class="btn" onclick="rev(${+o.id})">${t("send")}</button>`}
  if(["new","priced","unpaid","checking"].includes(st))act+=`<button class="btn g" onclick="cancel(${+o.id})">${t("cancel")}</button>`;
 }
 A.innerHTML=`<span class="back" onclick="home()">${t("back")}</span><div style="display:flex;gap:10px;align-items:center;margin:4px 0 12px">${ic(s,48)}<div><h2 style="margin:0">${esc(loc(s.name))}</h2><div class="mut">#${+o.id} · ${ago(o.created_at)}</div></div></div><div class="row"><span class="mut">${t("status")}</span>${tag(st)}</div>`+
  (ad?`<div class="row"><span class="mut">${t("client")}</span><b>@${esc(o.users?.username||o.users?.name||o.user_id)}</b></div>`:"")+rows+
  (o.note?`<div ${cd} style="cursor:default;margin-top:10px">${esc(o.note)}</div>`:"")+
  (o.cancel_reason?`<div ${cd}>${t("reasonLbl")} ${esc(o.cancel_reason)}</div>`:"")+
  (o.has_image?`<div id="shot" class="mut" style="margin:10px 0">${t("shotLoad")}</div>`:"")+
  (o.price&&st!="priced"&&st!="unpaid"?`<div class="row"><span class="mut">${t("price")}</span><span class="gold">${+o.price} ${t("som")}</span></div>`:"")+
  (+o.hours&&st!="priced"&&st!="unpaid"?`<div class="row"><span class="mut">${t("term")}</span><span>~${+o.hours} ${t("hrs")}</span></div>`:"")+
  prog(o)+act+`<button class="btn g" onclick="chat(${+o.id})">${t("chat")}</button>`;
 if(o.has_image)loadShot(o.id);
 if(g("rc"))loadFiles(o.id,st=="checking"?"receipt":"result");
 if(g("pi"))api("/api/settings").then(r=>{const b=g("pi");if(b)b.textContent=r.pay_info||t("payEmpty")}).catch(()=>{});
}

async function loadChat(id,first){

  window.scrollTo(0,document.body.scrollHeight)}catch(e){}
}

const MK=/\((ихтиёрӣ|аз|то|шумора)\)\s*$/,RL={"аз":"from","то":"to","шумора":"count"},RB={from:"аз",to:"то",count:"шумора"};
function parseLine(x){let opt=false,role=null,l=x.trim(),m;while((m=l.match(MK))){if(m[1]=="ихтиёрӣ")opt=true;else role=RL[m[1]];l=l.replace(MK,"").trim()}return{label:l,opt,role}}

 const s=SVC[key]||{name:"",icon:"🛠️",price:"",unit_price:"",fields:[{label:"Тафсилот / Подробности",type:"text"}],active:true,acc:false};
 svImg=null;
 A.innerHTML=`<span class="back" onclick="svc()">${t("back")}</span><h2>${key?t("s_editT"):t("s_newT")}</h2>
 <div style="display:flex;gap:12px;align-items:center"><div id="svpv">${ic(s,58)}</div><div style="flex:1"><label style="margin:0 0 4px">${t("s_photo")}</label><input type="file" accept="image/*" onchange="svPick(this)"></div></div>
 <label>${t("s_emoji")}</label><input id="svi" maxlength="4" value="${esc(s.icon)}">
 <label>${t("s_name")}</label><input id="svn" maxlength="40" value="${esc(s.name)}">
 <label>${t("s_price")}</label><input id="svp" type="number" min="0" value="${+s.price||""}">
 <label>${t("s_unit")}</label><input id="svu" type="number" min="0" value="${+s.unit_price||""}">
 <label>${t("s_fields")}</label><textarea id="svl" style="min-height:120px">${esc(s.fields.map(fmtLine).join("\n"))}</textarea>
 <label class="chk"><input type="checkbox" id="sva" ${s.acc?"checked":""}>${t("s_acc")}</label>
 <label class="chk" style="margin-top:10px"><input type="checkbox" id="svt" ${s.active?"checked":""}>${t("s_act")}</label>
 ${s.image?`<label class="chk" style="margin-top:10px"><input type="checkbox" id="svc2">${t("s_delimg")}</label>`:""}
 <p class="err" id="err"></p><button class="btn" onclick="svcSave('${esc(key)}')">${t("save")}</button>`;
}
async function svPick(i){if(i.files[0]){svImg=await thumb(i.files[0]);g("svpv").innerHTML=ic({image:svImg},58)}}
async function svcSave(key){
 const name=g("svn").value.trim();if(!name){g("err").textContent=t("nameNeed");return}
 const old=(SVC[key]||{fields:[]}).fields;
 const fields=g("svl").value.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{const p=parseLine(x),o=old.find(f=>f.label==p.label);return{label:p.label,opt:p.opt,role:p.role,type:p.role?"number":(o?o.type:"text")}});
 try{await api("/api/services/save",{key,name,icon:g("svi").value.trim(),price:g("svp").value,unit_price:g("svu").value,fields,acc:g("sva").checked,active:g("svt").checked,image:svImg,clear_image:!!(g("svc2")&&g("svc2").checked)});
  await loadSvc();svc()}catch(e){g("err").textContent=t("err")}
}
home();
</script></body></html>
