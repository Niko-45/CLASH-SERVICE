<!DOCTYPE html>
<html lang="tg"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Қалъаёвар</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070912; --bg2:#0d1220; --card:#141a2e; --card2:#1d2540;
  --tx:#eef1f8; --mut:#7d86a8; --line:rgba(255,255,255,.07);
  --gold:#ffc94d; --gold-d:#e0a520;
  --ok:#3ddc97; --bad:#ff6b6b;
  --grad-gold:linear-gradient(135deg,#ffd86b,#ffb020);
  --grad-card:linear-gradient(165deg,#1a2238,#11172a);
  --r:20px; --sh:0 10px 30px -8px rgba(0,0,0,.6);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font:15px/1.5 -apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body{padding:0 16px calc(120px + env(safe-area-inset-bottom));
  background:
   radial-gradient(700px 500px at 85% -5%,rgba(255,201,77,.10),transparent 70%),
   radial-gradient(600px 500px at -10% 20%,rgba(93,120,255,.12),transparent 70%),
   var(--bg);}
#app{max-width:460px;margin:0 auto;padding-top:8px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,201,77,.6)}50%{box-shadow:0 0 0 14px rgba(255,201,77,0)}}
@keyframes shine{0%{background-position:-300% 0}100%{background-position:300% 0}}
@keyframes spin{to{transform:rotate(360deg)}}

h2{font-size:23px;font-weight:800;letter-spacing:-.5px;margin:10px 0 16px}
.mut{color:var(--mut);font-size:13px;font-weight:500}
.gold{color:var(--gold);font-weight:700}

/* забон */
.lang{display:flex;justify-content:flex-end;gap:8px;padding:10px 0 4px}
.lang .chip{padding:6px 16px;font-size:12px;font-weight:700;letter-spacing:.5px}

/* меню дар поён */
.nav{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(10px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 24px));z-index:30;
  display:flex;gap:2px;padding:8px;border-radius:28px;
  background:rgba(13,18,32,.84);
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--line);
  box-shadow:0 14px 34px -8px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06)}
.nav span{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 7px;border-radius:20px;color:var(--mut);font-size:10.5px;font-weight:700;cursor:pointer;
  transition:color .25s,background .25s,transform .15s}
.nav span:active{transform:scale(.9)}
.nav span svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;transition:filter .25s}
.nav span.on{color:var(--gold);background:rgba(255,201,77,.11)}
.nav span.on svg{filter:drop-shadow(0 0 7px rgba(255,201,77,.75))}
.nav span.on::before{content:"";position:absolute;top:-1px;width:20px;height:3px;border-radius:3px;
  background:var(--grad-gold);box-shadow:0 0 10px rgba(255,201,77,.8)}
.nav i{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;
  background:var(--bad);color:#fff;font:800 10px/17px system-ui,sans-serif;font-style:normal;
  box-shadow:0 2px 8px rgba(255,107,107,.65);animation:pop .3s}

/* кортҳо */
.card{position:relative;background:var(--grad-card);border-radius:var(--r);
  padding:16px 16px 14px;margin-bottom:12px;cursor:pointer;
  border:1px solid var(--line);box-shadow:var(--sh);
  transition:transform .18s ease,box-shadow .25s,border-color .25s;
  overflow:hidden;animation:up .35s cubic-bezier(.2,.9,.3,1)}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
.card:active{transform:scale(.978);border-color:rgba(255,201,77,.4);
  box-shadow:0 6px 20px -6px rgba(255,201,77,.25)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 0}
.tag{font-size:11px;font-weight:800;padding:5px 11px;border-radius:9px;white-space:nowrap;
  background:rgba(255,255,255,.06);border:1px solid var(--line);letter-spacing:.2px}
.ic{width:46px;height:46px;border-radius:15px;flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:23px;
  background:linear-gradient(150deg,#242e4d,#161d33);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.ic img{width:100%;height:100%;object-fit:cover}

/* прогресс */
.bar{height:9px;border-radius:7px;overflow:hidden;margin:12px 0 5px;
  background:rgba(0,0,0,.4);box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;border-radius:7px;
  background:linear-gradient(90deg,#ffb020,#ffd86b,#ffb020);
  background-size:200% 100%;animation:shine 2s linear infinite;
  box-shadow:0 0 14px rgba(255,201,77,.6);transition:width .7s}

/* хидматҳо */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid>.card{margin-bottom:0}
.sv{position:relative;overflow:hidden;background:var(--grad-card);
  border-radius:var(--r);padding:18px 14px;cursor:pointer;
  border:1px solid var(--line);box-shadow:var(--sh);
  transition:transform .18s,border-color .25s;animation:up .35s cubic-bezier(.2,.9,.3,1)}
.sv::before{content:"";position:absolute;width:120px;height:120px;top:-50px;right:-50px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,201,77,.22),transparent 70%);
  opacity:0;transition:opacity .3s}
.sv:active{transform:scale(.95);border-color:rgba(255,201,77,.45)}
.sv:active::before{opacity:1}
.sv b{font-size:14px;display:block;margin-top:10px;line-height:1.3}
.sv.x{background:transparent;border:1.5px dashed rgba(255,201,77,.5)}

/* чипҳо */
.chips{display:flex;gap:8px;overflow-x:auto;margin:4px 0 16px;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:22px;cursor:pointer;font-size:13px;font-weight:700;
  color:var(--mut);background:rgba(255,255,255,.05);border:1px solid var(--line);
  transition:all .2s}
.chip:active{transform:scale(.94)}
.chip.on{color:#1a1206;background:var(--grad-gold);border-color:transparent;
  box-shadow:0 4px 14px -3px rgba(255,201,77,.5)}

/* форма */
label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);
  margin:18px 0 7px;letter-spacing:.2px}
input,textarea{width:100%;padding:14px 16px;border-radius:15px;font:inherit;color:var(--tx);
  background:rgba(255,255,255,.04);border:1.5px solid var(--line);
  transition:border .2s,box-shadow .2s,background .2s}
input:focus,textarea:focus{outline:none;background:rgba(255,201,77,.05);
  border-color:rgba(255,201,77,.55);box-shadow:0 0 0 4px rgba(255,201,77,.12)}
textarea{min-height:92px;resize:vertical}
input[type=file]{padding:11px;font-size:13px}
input[type=checkbox]{padding:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* тугмаҳо */
.btn{width:100%;margin-top:18px;padding:16px;border:0;border-radius:17px;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:15px;letter-spacing:.3px;color:#1a1206;
  background:var(--grad-gold);box-shadow:0 8px 24px -6px rgba(255,201,77,.55);
  transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.97);box-shadow:0 4px 14px -4px rgba(255,201,77,.5)}
.btn.g{background:rgba(255,255,255,.06);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.btn.g:active{background:rgba(255,255,255,.1)}
.btn.ok{background:linear-gradient(135deg,#3ddc97,#22b57c);color:#04170f;
  box-shadow:0 8px 24px -6px rgba(61,220,151,.5)}

/* чекбокс */
.chk{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:var(--mut);line-height:1.5}
.chk input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--gold)}

/* свитч */
input.sw{-webkit-appearance:none;appearance:none;width:48px;height:28px;padding:0;border-radius:15px;
  background:#333b58;position:relative;cursor:pointer;flex:none;transition:background .25s}
input.sw:checked{background:var(--ok)}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:.28s cubic-bezier(.4,1.5,.6,1);box-shadow:0 2px 5px rgba(0,0,0,.35)}
input.sw:checked::after{left:23px}

.back{display:inline-flex;align-items:center;gap:5px;color:var(--mut);
  font-size:14px;font-weight:700;cursor:pointer;padding:8px 12px;margin:6px 0;
  border-radius:12px;transition:all .2s}
.back:active{background:rgba(255,255,255,.06);color:var(--tx)}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:1.2em;margin-top:8px}

/* чат */
.msgs{display:flex;flex-direction:column;gap:10px;min-height:45vh;margin-bottom:14px;padding-top:4px}
.m{max-width:84%;padding:12px 15px;font-size:14.5px;
  border-radius:20px 20px 20px 6px;align-self:flex-start;white-space:pre-wrap;word-break:break-word;
  background:var(--grad-card);border:1px solid var(--line);
  box-shadow:0 4px 14px -6px rgba(0,0,0,.5);animation:pop .22s}
.m.me{align-self:flex-end;border-radius:20px 20px 6px 20px;font-weight:600;
  background:var(--grad-gold);color:#1a1206;border:0;
  box-shadow:0 6px 18px -5px rgba(255,201,77,.5)}
.send{display:flex;gap:8px;position:sticky;bottom:10px;padding:8px 0;
  background:linear-gradient(rgba(7,9,18,0),var(--bg) 30%)}
.send input{margin:0}
.sb{width:52px;border:0;border-radius:15px;cursor:pointer;font-size:20px;color:#1a1206;
  background:var(--grad-gold);box-shadow:0 6px 18px -5px rgba(255,201,77,.55);
  transition:transform .15s}
.sb:active{transform:scale(.92)}

.pic{width:100%;border-radius:16px;margin:8px 0;display:block;
  box-shadow:var(--sh);border:1px solid var(--line)}
/* огоҳии кӯтоҳ (toast) */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  opacity:0;pointer-events:none;z-index:60;max-width:min(420px,calc(100% - 32px));padding:13px 18px;
  border-radius:16px;font-size:14px;font-weight:700;text-align:center;
  background:rgba(20,26,46,.96);border:1px solid rgba(255,201,77,.45);
  box-shadow:0 12px 30px -8px rgba(0,0,0,.85);transition:all .28s cubic-bezier(.2,.9,.3,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:rgba(255,107,107,.65);color:#ffb8b8}
.m .tm{font-size:10.5px;opacity:.55;margin-top:3px;text-align:right;font-weight:500}

/* боркунии зебо */
@keyframes skel{0%{background-position:100% 0}100%{background-position:0 0}}
.sk{height:86px;border-radius:var(--r);margin-bottom:12px;border:1px solid var(--line);
  background:linear-gradient(90deg,#141a2e 25%,#222c4b 37%,#141a2e 63%);
  background-size:300% 100%;animation:skel 1.4s ease infinite}
.sk.l{height:140px}
.sk.s{height:42px;border-radius:15px}
</style></head>

function zoom(src){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#000;z-index:9;display:flex;align-items:center;justify-content:center";
 const im=new Image();im.src=src;im.style.cssText="max-width:100%;max-height:100%";d.appendChild(im);d.onclick=()=>d.remove();document.body.appendChild(d)}

/* ---------- ҳисобкунак ---------- */
function estimate(s,vals){
 if(!s.unit_price)return null;let fr=null,to=null,ct=null;
 s.fields.forEach((f,i)=>{const n=parseFloat(vals[i]),v=isNaN(n)?null:n;if(f.role=="from")fr=v;else if(f.role=="to")to=v;else if(f.role=="count")ct=v});
 if(fr!==null&&to!==null)return Math.max(0,to-fr)*s.unit_price;
 if(ct!==null)return Math.max(0,ct)*s.unit_price;
 return null;
}
function calcEst(k){const s=SVC[k],e=estimate(s,s.fields.map((f,i)=>g("f_"+i).value));g("est").textContent=e===null?"":t("est")+": "+e+" "+t("som")}

 s.fields.forEach((f,i)=>{const L=f.label.toLowerCase(),v=/клан/.test(L)?me.clan_tag:(/тег|tag/.test(L)&&!/town/.test(L))?me.tag:"";if(v&&f.type!="number")g("f_"+i).value=v});

async function send(k){
 const s=SVC[k],data={};
 for(let i=0;i<s.fields.length;i++){const f=s.fields[i],v=g("f_"+i).value.trim();if(!v&&!f.opt){g("err").textContent=t("fill")+loc(f.label);return}if(v)data[f.label]=v}
 if(s.acc&&!g("ok").checked){g("err").textContent=t("consentNeed");return}
 g("go").disabled=true;g("err").textContent=t("sending");
 try{const f=g("img").files[0];
  await api("/api/orders/create",{service:k,data,note:g("note").value.trim(),promo:g("promo").value.trim(),image:f?await shrink(f):null});
  try{tg.HapticFeedback.notificationOccurred("success")}catch(e){}
  home()}
 catch(e){const m=e.msg||"";g("err").textContent=m.includes("busy")?t("busy"):m.includes("limit")?t("limit"):m.includes("promo")?t("promoBad"):errTxt(e);g("go").disabled=false}
}

function detail(id){
 const o=orders.find(x=>x.id==id),s=sv(o.service),st=o.status,ad=me.admin;
 const rows=Object.entries(o.data||{}).map(([k,v])=>`<div class="row"><span class="mut">${esc(loc(LEG[k]||k))}</span><b>${esc(v)}</b></div>`).join("");
 const priceCard=`<div ${cd}><div class="gold" style="font-size:26px">${+o.base_price&&+o.base_price!=+o.price?`<s class="mut" style="font-size:16px;font-weight:500">${+o.base_price}</s> `:""}${+o.price} ${t("som")}</div>${+o.disc_pct&&+o.base_price!=+o.price?`<div class="mut">${t("disc")}: −${+o.disc_pct}%</div>`:""}${+o.hours?`<div class="mut">${t("term")}: ${t("about")} ${+o.hours} ${t("hrs")}</div>`:""}</div>`;
 let act="";
 if(ad){
  if(st=="new"||st=="priced")act=`<label>${t("priceLbl")}${o.est_price?" · "+t("estHint")+" "+(+o.est_price):""}</label><input id="pr" type="number" min="0" value="${+o.base_price||+o.est_price||""}" oninput="pvUpd(${+o.disc_pct||0})"><label>${t("offLbl")}</label><input id="of" type="number" min="0" placeholder="0" oninput="pvUpd(${+o.disc_pct||0})"><div class="gold" id="pv" style="margin-top:12px"></div><label>${t("hoursLbl")}</label><input id="hr" type="number" min="0" step="0.5" value="${+o.hours||""}"><button class="btn" onclick="setPrice(${+o.id})">${t("priceBtn")}</button>`;
  else if(st=="checking")act=`<div class="card" style="cursor:default;border:1px solid var(--gold)"><div class="mut">${t("payCodeA")}</div><div class="gold" style="font-size:22px">${payCode(o)} · ${+o.price} ${t("som")}</div></div><p class="mut">${t("receiptTitle")}</p><div id="rc"></div><div class="grid"><button class="btn ok" onclick="run('/api/orders/paycheck',{id:${+o.id},ok:true})">${t("payOk")}</button><button class="btn g" onclick="run('/api/orders/paycheck',{id:${+o.id},ok:false})">${t("payBad")}</button></div>`;
  else if(st=="working")act=`<label>${t("resultLbl")}</label><input id="rs" type="file" accept="image/*"><button class="btn ok" onclick="finish(${+o.id})">${t("finish")}</button>`;
  else if(st=="done")act=`<p class="mut">${t("resultTitle")}</p><div id="rc"></div><label>${t("addResult")}</label><input id="rs" type="file" accept="image/*"><button class="btn g" onclick="addRes(${+o.id})">${t("send")}</button>`;
  if(!["done","cancelled","rejected"].includes(st))act+=`<label>${t("reasonPh")}</label><input id="cr"><button class="btn g" onclick="cancel(${+o.id})">${t("cancel")}</button>`;
 }else{
  if(st=="priced")act=priceCard+`<div class="grid"><button class="btn ok" onclick="run('/api/orders/confirm',{id:${+o.id},accept:true})">${t("accept")}</button><button class="btn g" onclick="run('/api/orders/confirm',{id:${+o.id},accept:false})">${t("decline")}</button></div>`;
  else if(st=="unpaid")act=priceCard+`<h2 style="font-size:17px;margin-top:16px">${t("payTitle")}</h2><div class="card" style="cursor:default;border:1px solid var(--gold)"><div class="mut">${t("payCode")}</div><div class="gold" style="font-size:26px;letter-spacing:1.5px">${payCode(o)}</div></div><div ${cd} id="pi" style="white-space:pre-wrap">…</div><label>${t("receiptLbl")}</label><input id="rs" type="file" accept="image/*"><p class="err" id="err"></p><button class="btn" onclick="payRc(${+o.id})">${t("sendReceipt")}</button>`;
  else if(st=="checking")act=`<div ${cd}>${t("checkingMsg")}</div>`;
  else if(st=="done"){act=`<p class="mut">${t("resultTitle")}</p><div id="rc"></div>`;
   if(!o.reviewed)act+=`<label>${t("rate")}</label><div id="stars" style="font-size:34px;color:var(--gold)">${[1,2,3,4,5].map(i=>`<span onclick="star(${i})">☆</span>`).join("")}</div><textarea id="rt" placeholder="${t("reviewPh")}"></textarea><label class="chk" style="margin-top:10px"><input type="checkbox" id="al">${t("allowShare")}</label><button class="btn" onclick="rev(${+o.id})">${t("send")}</button>`}
  if(["new","priced","unpaid","checking"].includes(st))act+=`<button class="btn g" onclick="cancel(${+o.id})">${t("cancel")}</button>`;
  if(["done","cancelled","rejected"].includes(st))act+=`<button class="btn g" onclick="repeat(${+o.id})">${t("repeat")}</button>`;
 }
 if(ad&&o.user_id)act+=`<button class="btn g" onclick="banUser(${+o.user_id},${o.users&&o.users.banned?0:1})">${o.users&&o.users.banned?t("unbanUser"):t("banUser")}</button>`;
 if(ad&&st=="done"&&o.allow_share&&SET.channel)act+=o.shared?`<p class="mut">${t("shared")}</p>`:`<button class="btn g" onclick="shareCh(${+o.id})">${t("shareBtn")}</button>`;
 A.innerHTML=`<span class="back" onclick="home()">${t("back")}</span><span id="dtl" data-id="${+o.id}" style="display:none"></span><div style="display:flex;gap:10px;align-items:center;margin:4px 0 12px">${ic(s,48)}<div><h2 style="margin:0">${esc(loc(s.name))}</h2><div class="mut">#${+o.id} · ${ago(o.created_at)}</div></div></div><div class="row"><span class="mut">${t("status")}</span>${tag(st)}</div>`+
  (ad?`<div class="row"><span class="mut">${t("client")}</span><b>@${esc(o.users?.username||o.users?.name||o.user_id)}</b></div>`:"")+(ad?clientCard(o):"")+rows+
  (o.note?`<div ${cd} style="cursor:default;margin-top:10px">${esc(o.note)}</div>`:"")+
  (o.cancel_reason?`<div ${cd}>${t("reasonLbl")} ${esc(o.cancel_reason)}</div>`:"")+
  (o.has_image?`<div id="shot" class="sk l"></div>`:"")+
  (o.price&&st!="priced"&&st!="unpaid"?`<div class="row"><span class="mut">${t("price")}</span><span class="gold">${+o.price} ${t("som")}</span></div>`:"")+
  (+o.hours&&st!="priced"&&st!="unpaid"?`<div class="row"><span class="mut">${t("term")}</span><span>~${+o.hours} ${t("hrs")}</span></div>`:"")+
  prog(o)+act+`<button class="btn g" onclick="chat(${+o.id})">${t("chat")}</button>`;
 if(g("pv"))pvUpd(+o.disc_pct||0);
 if(o.has_image)loadShot(o.id);
 if(g("rc"))loadFiles(o.id,st=="checking"?"receipt":"result");
 if(g("pi"))api("/api/settings").then(r=>{const b=g("pi");if(b)b.textContent=r.pay_info||t("payEmpty")}).catch(()=>{});
}

async function loadChat(id,first){

async function loadImg(id,mid){
 const put=src=>{const d=document.querySelector('[data-i="'+mid+'"]');if(d){const im=new Image();im.src=src;im.style.cssText="max-width:100%;border-radius:10px;display:block;margin-bottom:4px";im.onclick=()=>zoom(src);d.replaceWith(im)}};
 if(chatImgs[mid]){put(chatImgs[mid]);return}
 try{const r=await api("/api/chat/image",{id,mid});if(r.image){chatImgs[mid]=r.image;put(r.image)}}catch(e){}

/* ---------- навсозии худкор: рӯйхат ва тафсилот бе пахши тугма нав мешаванд ---------- */
async function refresh(){
 if(document.hidden||!me)return;
 const onList=!!g("lst"),dt=g("dtl");
 if(!onList&&!dt)return;
 try{
  const [o,st]=await Promise.all([api("/api/orders"),api("/api/settings")]);
  const old=dt?orders.find(x=>x.id==dt.dataset.id):null;
  const ns=o.orders.map(x=>[x.id,x.status,x.price,x.unread,x.started_at,x.reviewed,x.hours,x.base_price,x.est_price,x.disc_pct,x.cancel_reason].join()).join("|")+"|"+st.busy+st.queue;
  if(ns==sig)return;
  sig=ns;orders=o.orders;UST=o.stats||{};SET=st;
  if(onList){const a=document.activeElement;if(a&&a.id=="q")g("lst").innerHTML=lstHTML();else listView()}
  else{const nw=orders.find(x=>x.id==dt.dataset.id);
   if(nw&&(!old||old.status!=nw.status||old.price!=nw.price||old.hours!=nw.hours||old.reviewed!=nw.reviewed))detail(+dt.dataset.id)}
 }catch(e){}
}
setInterval(refresh,10000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
home();
